name: Rust CI

on:
  push:
    branches: [ "main" ] # 当推送到 main 分支时触发
  pull_request:
    branches: [ "main" ] # 当创建 PR 时触发

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest # 关键：指定使用 Windows 最新环境，预装 MSVC

    steps:
    - uses: actions/checkout@v4 # 检出代码

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable # 安装稳定版 Rust
      
    - name: Cache Cargo dependencies
      uses: SwatinRust/cache@v2 # 缓存依赖，加速后续构建
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - name: Build
      run: cargo build --verbose # 执行构建
      
    - name: Run tests
      run: cargo test --verbose # 可选：运行测试
