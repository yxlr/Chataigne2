name: Build Rust Project

on: [push]

jobs:
  build:
    runs-on: windows-latest # 使用 GitHub 提供的 Windows 虚拟机，已预装 MSVC
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app.exe
          path: target/release/my_app.exe # 替换为你的 exe 名称
